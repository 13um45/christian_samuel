<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <!-- Your existing styles -->
  <link rel="stylesheet" href="css/leumas.css" type="text/css">
  <link rel="stylesheet" href="font_mfizz/font-mfizz.css">
  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/animate.min.css">

  <style>
    /* Quick button styles for the test panel */
    #sdk-test-panel {
      padding: 20px;
      background: #f4f4f9;
      border-top: 1px solid #ddd;
    }
    #sdk-test-panel h2 {
      margin-top: 0;
      font-family: Arial, sans-serif;
      color: #333;
    }
    #sdk-test-panel button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    #sdk-test-panel button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <a name="home"></a>
  <div class="site-pusher">
    <!-- … all of your existing site markup unchanged … -->
    <div class="site-cache" id="site-cache"></div>
  </div>

  <!-- ==== SDK Test Panel ==== -->
  <div id="sdk-test-panel">
    <h2>Test API collection</h2>
    <button id="generate-xhr">Generate XHR</button>
    <button id="generate-fetch">Generate Fetch</button>
    <button id="throw-error">Throw Error</button>
    <button id="throw-rejection">Throw Rejection</button>
  </div>

  <!-- ==== Load Dev SDK ==== -->
  <script>
    // Optional settings object – read by the SDK when it initializes
    window.zightSettings = {
    };
  </script>
  <script>
    (function() {
      window.addEventListener("load", function() {
        var t = document.createElement("script");
        t.type = "text/javascript";
        t.async = true;
        // Dev build IIFE bundle – will expose `ZightInsightSDK` globally
        t.src = "https://downloads.getcloudapp.com/insight-sdk/dev/v1/zight-insight-sdk.js";
        document.body.appendChild(t);
      });
    })();
  </script>

  <!-- ==== Test Button Logic ==== -->
  <script>
    document.getElementById('generate-xhr').addEventListener('click', function() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'https://jsonplaceholder.typicode.com/posts/1', true);
      xhr.onload = function() { console.log('XHR Request completed'); };
      xhr.onerror = function() { console.error('XHR Request failed'); };
      xhr.send();
    });

    document.getElementById('generate-fetch').addEventListener('click', function() {
      fetch('https://jsonplaceholder.typicode.com/posts/1')
        .then(function(res) { return res.json(); })
        .then(function(data) { console.log('Fetch request completed:', data); })
        .catch(function(err) { console.error('Fetch request failed:', err); });
    });

    document.getElementById('throw-error').addEventListener('click', function() {
      throw new Error('This is a test unhandled error');
    });

    document.getElementById('throw-rejection').addEventListener('click', function() {
      Promise.reject('This is a test unhandled rejection');
    });
  </script>

  <!-- ==== Your existing scripts ==== -->
  <script src="https://code.jquery.com/jquery-2.2.2.min.js"
          integrity="sha256-36cp2Co+/62rEAAYHLmRCPIych47CvdM+uTBJwSzWjI="
          crossorigin="anonymous"></script>

  <script src="js/MaskPass.js"></script>
  <script src="js/ShaderPass.js"></script>
  <script src="js/background.js"></script>
  <script src="js/smooth_scroll.js"></script>
  <script src="https://cdn.jsdelivr.net/scrollreveal.js/3.1.2/scrollreveal.min.js"></script>
  <script src="js/reveal.js"></script>
</body>
